<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPARC & NICOLE Architecture of Renewal</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #09111E;
            color: #FFFFFF;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #0D192B;
            border: 1px solid #0097A7;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 151, 167, 0.2);
            padding: 30px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #FFFFFF;
            margin: 0 0 5px 0;
            font-size: 26px;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #0097A7;
            margin: 0 0 25px 0;
            font-size: 14px;
            font-weight: 600;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .node-card {
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: pointer;
        }
        .node-card:hover {
            transform: translateY(-3px);
            filter: drop-shadow(0 0 12px rgba(0, 151, 167, 0.5));
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SPARC & NICOLE ARCHITECTURE OF RENEWAL</h1>
        <p class="subtitle">Automated HMIS Export Validation, Trauma-Informed Triage & CoC Resource Routing</p>
        
        <svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Marker for Flow Arrows -->
                <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#006B3C" />
                </marker>
                <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0097A7" />
                </marker>
                <marker id="arrow-coral" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6F61" />
                </marker>
                <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4C2F0" />
                </marker>
            </defs>

            <!-- Radial Connectors to Center -->
            <line x1="280" y1="180" x2="600" y2="337" stroke="#0097A7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
            <line x1="920" y1="180" x2="600" y2="337" stroke="#0097A7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
            <line x1="920" y1="495" x2="600" y2="337" stroke="#0097A7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
            <line x1="280" y1="495" x2="600" y2="337" stroke="#0097A7" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>

            <!-- Outer Directional Flow Curved Arcs -->
            <path d="M 450,130 Q 600,90 750,130" fill="none" stroke="#006B3C" stroke-width="3.5" marker-end="url(#arrow-green)"/>
            <path d="M 1050,280 Q 1090,337 1050,400" fill="none" stroke="#0097A7" stroke-width="3.5" marker-end="url(#arrow-teal)"/>
            <path d="M 750,550 Q 600,590 450,550" fill="none" stroke="#FF6F61" stroke-width="3.5" marker-end="url(#arrow-coral)"/>
            <path d="M 150,400 Q 110,337 150,280" fill="none" stroke="#D4C2F0" stroke-width="3.5" marker-end="url(#arrow-purple)"/>

            <!-- Center SPARC Integrity Core -->
            <circle cx="600" cy="337" r="110" fill="#0B1B2A" stroke="#0097A7" stroke-width="4"/>
            <circle cx="600" cy="337" r="85" fill="#072A2E" stroke="#006B3C" stroke-width="2"/>
            <text x="600" y="325" fill="#FFFFFF" font-size="15" font-weight="bold" text-anchor="middle">SPARC CORE</text>
            <text x="600" y="348" fill="#0097A7" font-size="10" font-weight="bold" text-anchor="middle">Data Verification Matrix</text>
            <text x="600" y="367" fill="#94A8C0" font-size="9" text-anchor="middle">Continuous Integrity Loop</text>

            <!-- Stage 01: Eva CSV Structure Guard -->
            <g class="node-card">
                <rect x="80" y="80" width="360" height="190" rx="14" fill="#101F30" stroke="#006B3C" stroke-width="3"/>
                <rect x="100" y="60" width="110" height="26" rx="6" fill="#006B3C"/>
                <text x="155" y="77" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STAGE 01</text>
                <text x="105" y="118" fill="#FFFFFF" font-size="16" font-weight="bold">Eva CSV Structure Guard</text>
                <text x="105" y="140" fill="#0097A7" font-size="12" font-weight="bold">Automated Pre-Submission Audit</text>
                <text x="105" y="170" fill="#94A8C0" font-size="11">Detects missing columns, schema errors &amp; invalid</text>
                <text x="105" y="190" fill="#94A8C0" font-size="11">codes. Hashes records via SHA-256 without PII risk.</text>
            </g>

            <!-- Stage 02: SPARC Triage Engine -->
            <g class="node-card">
                <rect x="760" y="80" width="360" height="190" rx="14" fill="#101F30" stroke="#0097A7" stroke-width="3"/>
                <rect x="780" y="60" width="110" height="26" rx="6" fill="#0097A7"/>
                <text x="835" y="77" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STAGE 02</text>
                <text x="785" y="118" fill="#FFFFFF" font-size="16" font-weight="bold">SPARC Triage Engine</text>
                <text x="785" y="140" fill="#0097A7" font-size="12" font-weight="bold">Trauma-Informed Prioritization</text>
                <text x="785" y="170" fill="#94A8C0" font-size="11">Low-barrier Coordinated Entry triage (UDE 4.19).</text>
                <text x="785" y="190" fill="#94A8C0" font-size="11">Routes households to RRH/PSH without preconditions.</text>
            </g>

            <!-- Stage 03: System Performance Analytics -->
            <g class="node-card">
                <rect x="760" y="405" width="360" height="190" rx="14" fill="#101F30" stroke="#FF6F61" stroke-width="3"/>
                <rect x="780" y="385" width="110" height="26" rx="6" fill="#FF6F61"/>
                <text x="835" y="402" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STAGE 03</text>
                <text x="785" y="443" fill="#FFFFFF" font-size="16" font-weight="bold">System Performance Analytics</text>
                <text x="785" y="465" fill="#0097A7" font-size="12" font-weight="bold">Predictive Risk &amp; SPM Metrics</text>
                <text x="785" y="495" fill="#94A8C0" font-size="11">Analyzes HUD System Performance Measures (SPM).</text>
                <text x="785" y="515" fill="#94A8C0" font-size="11">Identifies housing bottlenecks in real time.</text>
            </g>

            <!-- Stage 04: Stella Policy Router -->
            <g class="node-card">
                <rect x="80" y="405" width="360" height="190" rx="14" fill="#101F30" stroke="#D4C2F0" stroke-width="3"/>
                <rect x="100" y="385" width="110" height="26" rx="6" fill="#6B5299"/>
                <text x="155" y="402" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">STAGE 04</text>
                <text x="105" y="443" fill="#FFFFFF" font-size="16" font-weight="bold">Stella Policy Router</text>
                <text x="105" y="465" fill="#0097A7" font-size="12" font-weight="bold">CoC Resource Allocation</text>
                <text x="105" y="495" fill="#94A8C0" font-size="11">Automates regional funding strategies, housing</text>
                <text x="105" y="515" fill="#94A8C0" font-size="11">placement verification &amp; federal grant optimization.</text>
            </g>
        </svg>
    </div>
</body>
</html>
